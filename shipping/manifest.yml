apiVersion: v1 
kind: ConfigMap 
metadata:
  name: shipping-config
  namespace: roboshop
data: 
  CART_ENDPOINT: "cart:8080"
  DB_HOST: "mysql"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-ds
  namespace: roboshop
  labels:
    app: shipping
    project: roboshop
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping
      project: roboshop
      tier: app
  template:
    metadata:
      labels:
        app: shipping
        project: roboshop
        tier: app
    spec:
      containers:
      - name: shipping
        image: narupallearun/shipping:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef: 
            name: shipping-config

---
apiVersion: v1 
kind: Service 
metadata:
  name: shipping-service 
  namespace: roboshop
spec:
  selector:
    app: shipping
    project: roboshop
    tier: app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080  


