apiVersion: v1 
kind: ConfigMap 
metadata:
  name: catalogue-config
  namespace: roboshop
data: 
  MONGO: "true"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-ds
  namespace: roboshop
  labels:
    app: catalogue
    project: roboshop
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogue
      project: roboshop
      tier: app
  template:
    metadata:
      labels:
        app: catalogue
        project: roboshop
        tier: app
    spec:
      containers:
      - name: catalogue
        image: narupallearun/catalogue:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef: 
            name: catalogue-config

---
apiVersion: v1 
kind: Service 
metadata:
  name: catalogue-service 
  namespace: roboshop
spec:
  selector:
    app: catalogue
    project: roboshop
    tier: app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080  


