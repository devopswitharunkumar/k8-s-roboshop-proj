apiVersion: v1 
kind: ConfigMap 
metadata:
  name: user-config
  namespace: roboshop
data: 
  MONGO: "true"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-ds
  namespace: roboshop
  labels:
    app: user
    project: roboshop
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
      project: roboshop
      tier: app
  template:
    metadata:
      labels:
        app: user
        project: roboshop
        tier: app
    spec:
      containers:
      - name: user
        image: narupallearun/user:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef: 
            name: user-config

---
apiVersion: v1 
kind: Service 
metadata:
  name: user-service 
  namespace: roboshop
spec:
  selector:
    app: user
    project: roboshop
    tier: app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080  


